<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
            background-color: aliceblue;
            color: hsla(120, 25.14%, 45%, 1);
            height: 200px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 35px;
            padding: 15px;
            
        }

        button{
            font-size: 20px;
            padding: 15px;
            border-radius: 18px;
            color: blue;
        }
input{
    padding: 15px 75px;
    color: darkslategrey;
    font-size: 20px;
      border-radius: 18px;
}

.container{
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    grid-auto-rows: 400px;
    background-color: antiquewhite;
    gap: 15px;
    padding: 15px;
   
}
.card{
    background-color:darkred ;
     border-radius: 18px;
     color: azure;
     
     display: flex;
     flex-direction: column;
     align-items: center;
    
}

h4{
     font-weight: 900;
     font-size: 25px;
}
    .card img{
        height: 300px;
        width: 100%;
      border-radius: 18px;
    }
    a{
        height: 100%;
        width: 100%;
    }
    </style>
</head>
<body>
    <div class="container">
       <a href=""> <div class="card"></div></a>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>
</body>
</html>
