<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
            background-color: aliceblue;
            color: hsla(120, 25.14%, 45%, 1);
            height: 200px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 35px;
            padding: 15px;
            
        }

        .heading{
            color: darkorchid;
          
            margin-top:5px;
            margin-left: 500px;
        }

        button{
            font-size: 20px;
            padding: 15px;
            border-radius: 18px;
            color: blue;
        }
input{
    padding: 15px 75px;
    color: darkslategrey;
    font-size: 20px;
      border-radius: 18px;
      border: 1px solid black;
}

.container{
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    grid-auto-rows: 400px;
    background-color: antiquewhite;
    gap: 35px;
    padding: 15px;
   
}
.card{
    background-color:darkred ;
     border-radius: 18px;
     color: white;
     
     display: flex;
     flex-direction: column;
     align-items: center;
     line-height: 1.4;
    
}

h3{
     font-weight: 900;
     font-size: 50px;
}

h4{
    font-size: 25px;
}

p{
    font-size: 16px;
    color: azure;
}
    .card img{
        height: 300px;
        width: 100%;
      border-radius: 18px;
    }
    a{
        height: 100%;
        width: 100%;
        color: white;
        text-decoration: none;
        text-align: center;
          
    }
   

    </style>
</head>
<body>
    <header>
        <div class="heading"><h3>Movie Website</h3></div>
        <div>
       
             <input type="text" name="" id="input" placeholder="Enter your movie..">
            <button id="search">Search</button>
        </div>
    </header>

    <main>
        <div class="container">
          
         
        </div>
       
    </main>
    <script>
        const inputVar=document.querySelector("#input");
        const buttonVar=document.querySelector("#search")
          const containerVar=document.querySelector(".container");

        async function moviefn() {
         

             const a= await fetch("https://api.tvmaze.com/shows");
        // console.log(a);
        const b= await a.json();
        // console.log(b[0]);
        for(let movie of b){
            const cardVar=document.createElement("div");
            cardVar.classList.add("card");
           
            cardVar.innerHTML=`<a href="${movie.url}"><img src=" ${movie.image.original}" alt="">
            <div><h4>${movie.name} </h4> <p>${movie.genres}</p> <p>${movie.language}</p></div>
            </a>`;
              containerVar.append(cardVar);
        }
       

        
        }

        moviefn();


         async function moviefn2(movie_name) {

             const a= await fetch("https://api.tvmaze.com/shows");
        // console.log(a);

            // console.log(movie.name);

            <div><h4>${movie.name} </h4> <p>${movie.genres}</p> <p>${movie.language}</p></div>
            </a>`;
            console.log(cardVar);
              containerVar.append(cardVar);

        }
       

        
        }

     
            buttonVar.addEventListener("click",()=>{

            })
          
       

        inputVar.addEventListener("keyup",(event)=>{
           if(event.key==="Enter"){
            console.log(inputVar.value);
           }
                  
            
          
        })

        
       
    </script>
</body>
</html>
